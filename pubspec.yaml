name: obd2_diagnostics
description: >
  Lập trình phần mềm đọc thông tin hệ thống điều khiển động cơ
  bằng thiết bị chẩn đoán dựa trên chip ELM327

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ─────────────────────────
  flutter_riverpod: ^2.4.9
    # Supabase
  supabase_flutter: ^2.5.0
  connectivity_plus: ^6.0.3

  # ── Bluetooth Classic SPP ─────────────────────
  flutter_bluetooth_serial: ^0.4.0

  # ── Database ──────────────────────────────────
  sqflite: ^2.3.2
  path: ^1.8.3

  # ── Charts ────────────────────────────────────
  fl_chart: ^0.67.0

  # ── UI ────────────────────────────────────────

  # ── Utilities ─────────────────────────────────
  intl: ^0.19.0
  logger: ^2.0.2+1
  permission_handler: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
